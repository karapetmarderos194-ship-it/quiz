.main-btn:active {

    font-size: 24px;
  }

  .answer-btn {
    font-size: 15px;
  }

                <script>(function installLiveweaveConsoleBridge() {
        if (window.__liveweaveConsoleBridge) return;
        window.__liveweaveConsoleBridge = true;

        function format(value) {
            if (typeof value === 'string') return value;
            if (typeof value === 'undefined') return 'undefined';
            if (typeof value === 'function') return value.toString();
            if (value instanceof Error) return value.name + ': ' + value.message;
            if (value instanceof Element) return value.outerHTML;
            try {
                var seen = [];
                return JSON.stringify(value, function(key, item) {
                    if (typeof item === 'object' && item !== null) {
                        if (seen.indexOf(item) !== -1) return '[Circular]';
                        seen.push(item);
                    }
                    return item;
                }, 2);
            } catch (err) {
                return String(value);
            }
        }

        function send(type, values, id) {
            parent.postMessage({
                source: 'liveweave-preview-console',
                type: type,
                id: id || '',
                values: (values || []).map(format)
            }, '*');
        }

        ['log', 'info', 'warn', 'error', 'debug'].forEach(function(level) {
            var original = console[level];
            console[level] = function() {
                var args = Array.prototype.slice.call(arguments);
                send(level === 'log' || level === 'debug' ? 'log' : level, args);
                if (original) original.apply(console, args);
            };
        });

        window.addEventListener('error', function(event) {
            send('error', [event.message + (event.lineno ? ' (line ' + event.lineno + ')' : '')]);
        });
        window.addEventListener('unhandledrejection', function(event) {
            send('error', ['Unhandled promise rejection:', event.reason]);
        });
        window.addEventListener('message', function(event) {
            var message = event.data || {};
            if (event.source !== parent || message.source !== 'liveweave-parent-console' || message.type !== 'evaluate') return;
            try {
                var result = (0, eval)(message.code);
                Promise.resolve(result).then(function(value) {
                    send('result', [value], message.id);
                }, function(error) {
                    send('error', [error], message.id);
                });
            } catch (error) {
                send('error', [error], message.id);
            }
        });
        send('ready', []);
    })();</script>
                <script>(function installPreviewLinkGuard() {
        var noticeTimer;

        function showNotice(message) {
            var notice = document.getElementById('lw-preview-link-notice');
            if (!notice) {
                notice = document.createElement('div');
                notice.id = 'lw-preview-link-notice';
                notice.setAttribute('role', 'status');
                notice.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:2147483647;max-width:calc(100% - 24px);padding:10px 14px;border-radius:9px;background:#17212d;color:#fff;font:13px/1.4 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none;';
                document.body.appendChild(notice);
            }
            notice.textContent = message;
            notice.hidden = false;
            clearTimeout(noticeTimer);
            noticeTimer = setTimeout(function() { notice.hidden = true; }, 3500);
        }

        document.addEventListener('click', function(event) {
            var link = event.target.closest && event.target.closest('a[href]');
            if (!link || event.defaultPrevented) return;

            var href = (link.getAttribute('href') || '').trim();
            if (href.charAt(0) === '#') {
                event.preventDefault();
                var fragment = href.slice(1);
                if (!fragment) {
                    window.scrollTo(0, 0);
                    return;
                }
                try { fragment = decodeURIComponent(fragment); } catch (error) {}
                var target = document.getElementById(fragment) || document.getElementsByName(fragment)[0];
                if (target) target.scrollIntoView();
                return;
            }

            if (/^(https?:)?\/\//i.test(href)) {
                event.preventDefault();
                window.open(href, '_blank', 'noopener,noreferrer');
                return;
            }

            if (/^(mailto:|tel:)/i.test(href)) return;

            event.preventDefault();
            showNotice('This page cannot be opened in the preview.');
        }, true);
    })();</script>

                <script>const questions = [

  {

      B: "ձվաձև պատուհանի վրա",

const startScreen = document.getElementById("start-screen");
const quizScreen = document.getElementById("quiz-screen");
const resultScreen = document.getElementById("result-screen");

const startBtn = document.getElementById("start-btn");
const nextBtn = document.getElementById("next-btn");
const restartBtn = document.getElementById("restart-btn");

const counter = document.getElementById("counter");
const scoreText = document.getElementById("score-text");
const progress = document.getElementById("progress");
const questionNumber = document.getElementById("question-number");
const questionText = document.getElementById("question");
const answerButtons = [...document.querySelectorAll(".answer-btn")];
const timerText = document.getElementById("timer-text");
const timerRing = document.getElementById("timer-ring");
const feedback = document.getElementById("feedback");
const finalScore = document.getElementById("final-score");
const resultMessage = document.getElementById("result-message");

let currentQuestion = 0;
let score = 0;
let timerId = null;
let answered = false;
let audioContext = null;
let wrongAnswersList = []; // 🔄 Զանգված՝ սխալ պատասխանները պահելու համար

function playBeep(frequency = 700, duration = 0.12, volume = 0.07) {
  try {
    audioContext ??= new (
      window.AudioContext || window.webkitAudioContext
    )();

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = frequency;
    gain.gain.value = volume;

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();
    oscillator.stop(audioContext.currentTime + duration);
  } catch (error) {
    console.warn("Ձայնը հնարավոր չեղավ միացնել։", error);
  }
}

function startQuiz() {
  clearInterval(timerId);

  currentQuestion = 0;
  score = 0;
  wrongAnswersList = []; // 🔄 Մաքրում ենք նախորդ խաղի սխալները

  // Հեռացնում ենք հին սխալների բլոկը, եթե այն արդեն գոյություն ունի
  const oldReview = document.getElementById("wrong-answers-review");
  if (oldReview) oldReview.remove();

  scoreText.textContent = "Միավորներ՝ 0";
  startScreen.hidden = true;
  resultScreen.hidden = true;
  quizScreen.hidden = false;

  showQuestion();
}

function showQuestion() {
  clearInterval(timerId);

  answered = false;

  const item = questions[currentQuestion];

  counter.textContent =
    `Հարց ${currentQuestion + 1} / ${questions.length}`;

  questionNumber.textContent =
    `ՀԱՐՑ ${currentQuestion + 1} / ${questions.length}`;

  questionText.textContent = item.question;
  timerText.textContent = "20";
  timerRing.classList.remove("warning");

  progress.style.width =
    `${(currentQuestion / questions.length) * 100}%`;

  feedback.textContent = "";
  nextBtn.hidden = true;

  answerButtons.forEach(button => {
    const letter = button.dataset.answer;

    button.textContent = `${letter}. ${item.answers[letter]}`;
    button.disabled = false;
    button.classList.remove("correct", "wrong");
  });

  playBeep(700, 0.12, 0.07);

  const startTime = Date.now();
  let lastSecond = 20;

  timerId = setInterval(() => {
    if (answered) {
      clearInterval(timerId);
      return;
    }

    const elapsed = Date.now() - startTime;
    const remaining = Math.max(0, 20 - Math.floor(elapsed / 1000));

    if (remaining !== lastSecond) {
      lastSecond = remaining;
      timerText.textContent = remaining;

      if (remaining > 0) {
        if (remaining <= 5) {
          timerRing.classList.add("warning");
        }

        if (remaining === 1) {
          playBeep(1000, 0.65, 0.16);
        } else {
          playBeep(700, 0.12, 0.07);
        }
      }
    }

    if (elapsed >= 20000) {
      clearInterval(timerId);
      timerText.textContent = "0";
      revealAnswer(null);
    }
  }, 50);
}

function chooseAnswer(event) {
  if (answered) return;

  revealAnswer(event.currentTarget.dataset.answer);
}

function revealAnswer(selected) {
  if (answered) return;

  answered = true;
  clearInterval(timerId);

  const item = questions[currentQuestion];

  answerButtons.forEach(button => {
    button.disabled = true;

    if (button.dataset.answer === item.correct) {
      button.classList.add("correct");
    } else if (button.dataset.answer === selected) {
      button.classList.add("wrong");
    }
  });

  if (selected === item.correct) {
    score++;
    scoreText.textContent = `Միավորներ՝ ${score}`;
    feedback.textContent = "Ճիշտ է՛։ Ապրե՛ս։ 🎉";
    playBeep(900, 0.2, 0.1);
  } else {
    // 🔄 Եթե սխալ է կամ ժամանակը սպառվել է, ավելացնում ենք սխալների ցուցակում
    wrongAnswersList.push({
      question: item.question,
      userAnswer: selected ? `${selected}. ${item.answers[selected]}` : "Ժամանակը սպառվեց",
      correctAnswer: `${item.correct}. ${item.answers[item.correct]}`
    });

    if (selected === null) {
      feedback.textContent =
        `Ժամանակը վերջացավ։ Ճիշտ պատասխանն է՝ ${item.correct}. ${item.answers[item.correct]}`;
    } else {
      feedback.textContent =
        `Սխալ պատասխան։ Ճիշտն է՝ ${item.correct}. ${item.answers[item.correct]}`;
    }
  }

  progress.style.width =
    `${((currentQuestion + 1) / questions.length) * 100}%`;

  nextBtn.textContent =
    currentQuestion === questions.length - 1
      ? "Տեսնել արդյունքը"
      : "Հաջորդ հարցը";

  nextBtn.hidden = false;
}

function nextQuestion() {
  if (!answered) return;

  currentQuestion++;

  if (currentQuestion < questions.length) {
    showQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  clearInterval(timerId);

  quizScreen.hidden = true;
  resultScreen.hidden = false;

  finalScore.textContent =
    `Քո արդյունքը՝ ${score} / ${questions.length}`;

  if (score === 6) {
    resultMessage.textContent = "Կատարյալ արդյունք։ Վեցը՝ վեցից։ 🏆";
  } else if (score >= 4) {
    resultMessage.textContent = "Շատ լավ արդյունք։ Շարունակի՛ր։ 🌟";
  } else if (score >= 2) {
    resultMessage.textContent = "Լավ փորձ էր։ Կրկնի՛ր ու բարելավիր արդյունքդ։ 💚";
  } else {
    resultMessage.textContent = "Փորձի՛ր ևս մեկ անգամ։ Դու կկարողանաս։ 💪";
  }

  // 🔄 Սխալների վերլուծության բլոկի կառուցում
  if (wrongAnswersList.length > 0) {
    const reviewContainer = document.createElement("div");
    reviewContainer.id = "wrong-answers-review";
    reviewContainer.style.marginTop = "24px";
    reviewContainer.style.textAlign = "left";
    reviewContainer.style.background = "rgba(255, 255, 255, 0.1)";
    reviewContainer.style.padding = "16px";
    reviewContainer.style.borderRadius = "12px";
    reviewContainer.style.maxHeight = "250px";
    reviewContainer.style.overflowY = "auto";

    const title = document.createElement("h3");
    title.textContent = "Քո թույլ տված սխալները. 📋";
    title.style.color = "#ff8293";
    title.style.marginTop = "0";
    title.style.fontSize = "18px";
    reviewContainer.appendChild(title);

    wrongAnswersList.forEach((fault, index) => {
      const itemDiv = document.createElement("div");
      itemDiv.style.marginBottom = "14px";
      itemDiv.style.borderBottom = "1px solid rgba(255,255,255,0.15)";
      itemDiv.style.paddingBottom = "8px";

      itemDiv.innerHTML = `
        <p style="margin: 4px 0; font-weight: bold; color: #fff;">${index + 1}. ${fault.question}</p>
        <p style="margin: 2px 0 2px 12px; color: #ff8293; font-size: 14px;">❌ Քո պատասխանը՝ ${fault.userAnswer}</p>
        <p style="margin: 2px 0 2px 12px; color: #39ff88; font-size: 14px;">✅ Ճիշտ պատասխանը՝ ${fault.correctAnswer}</p>
      `;
      reviewContainer.appendChild(itemDiv);
    });

    // Տեղադրում ենք հաղորդագրության տեքստից առաջ (վերագործարկման կոճակից վերև)
    restartBtn.parentNode.insertBefore(reviewContainer, restartBtn);
  }

  counter.textContent = "Թեստն ավարտված է";
  progress.style.width = "100%";
}

startBtn.addEventListener("click", startQuiz);
nextBtn.addEventListener("click", nextQuestion);
restartBtn.addEventListener("click", startQuiz);

answerButtons.forEach(button => {
  button.addEventListener("click", chooseAnswer);
});
</script>
